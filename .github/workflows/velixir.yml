name: Deploy to velixir

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Velixir CLI
        run: |
          curl -fsSL https://velixir.net/install.sh | sh
          echo "$HOME/.velixir/bin" >> "$GITHUB_PATH"

      - name: Deploy to Velixir
        run: velixir deploy --app c6160031-c43d-4f86-9431-a3594f3330b0
        env:
          VELIXIR_API_KEY: ${{ secrets.VELIXIR_API_KEY }}